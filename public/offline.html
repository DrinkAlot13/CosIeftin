<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ești offline — CosIeftin</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f6f8f4; color: #1a1f19; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #12150f; color: #eef1e9; } }
  .box { max-width: 380px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #5a6157; line-height: 1.55; margin: 0 0 18px; }
  @media (prefers-color-scheme: dark) { p { color: #a8b0a4; } }
  a {
    display: inline-block; padding: 11px 20px; border-radius: 9px;
    background: #1f6b4a; color: #fff; text-decoration: none; font-weight: 600;
  }
  .emoji { font-size: 44px; display: block; margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="box">
    <span class="emoji">🛒</span>
    <h1>Ești offline</h1>
    <p>Nu avem semnal ca să încărcăm prețurile noi. Lista ta e salvată pe telefon — o vezi imediat ce revii online.</p>
    <a href="/lista">Deschide lista</a>
  </div>
</body>
</html>
